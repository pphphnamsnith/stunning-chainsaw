
name: Secure Windows RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Configure RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale was not installed."
          }

          & $ts up `
            --authkey=$env:TS_AUTHKEY `
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5
          & $ts ip -4

      - name: Verify RDP Service
        shell: pwsh
        run: |
          $service = Get-Service -Name TermService

          if ($service.Status -ne "Running") {
            Start-Service -Name TermService
          }

          Write-Host "RDP service is running."
          Write-Host "Check Tailscale IP in the previous step."
